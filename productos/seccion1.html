<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda & Alta Costura | Huellas & Estilo</title>
    <link rel="icon" type="image/png" href="huellitas.jpg">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🐾 Huellas<span>&</span>Estilo</div>
        <ul class="nav-links">
            <li><a href="../index.html">Volver al Inicio</a></li>
            <li><a href="../carrito.html">🛒 Ver Carrito</a></li>
        </ul>
    </header>

    <section class="universe-section">
        <div class="container">
            <div class="section-title">
                <h2>Sección 01: Moda & Alta Costura</h2>
                <p>Productos exclusivos para vestir a tu mascota</p>
            </div>

            <div class="universe-grid">
                <!-- Producto 1 -->
                <div class="universe-card">
                    <div class="card-content">
                        <h3>Abrigo de Lana Italiana</h3>
                        <p>Diseño exclusivo para clima frío.</p>
                        <p><strong>Precio: $45.00</strong></p>
                        <!-- Se agregó la clase btn-agregar y los datos del producto -->
                        <button class="btn primary-btn btn-agregar" data-nombre="Abrigo de Lana Italiana" data-precio="45.00" style="width: 100%; border: none; cursor: pointer; padding: 0.8rem; border-radius: 50px; font-weight: bold;">
                            Agregar al Carrito
                        </button>
                    </div>
                </div>

                <!-- Producto 2 -->
                <div class="universe-card">
                    <div class="card-content">
                        <h3>Corbatín Elegante</h3>
                        <p>Ajustable y cómodo para ocasiones especiales.</p>
                        <p><strong>Precio: $15.00</strong></p>
                        <!-- Se agregó la clase btn-agregar y los datos del producto -->
                        <button class="btn primary-btn btn-agregar" data-nombre="Corbatín Elegante" data-precio="15.00" style="width: 100%; border: none; cursor: pointer; padding: 0.8rem; border-radius: 50px; font-weight: bold;">
                            Agregar al Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- LÓGICA PARA ENVIAR AL CARRITO -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const botonesAgregar = document.querySelectorAll(".btn-agregar");

            botonesAgregar.forEach(boton => {
                boton.addEventListener("click", (e) => {
                    e.preventDefault(); 

                    const nombreProducto = boton.getAttribute("data-nombre");
                    const precioProducto = parseFloat(boton.getAttribute("data-precio"));

                    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
                    const index = carrito.findIndex(prod => prod.nombre === nombreProducto);

                    if (index !== -1) {
                        carrito[index].cantidad += 1;
                    } else {
                        carrito.push({
                            nombre: nombreProducto,
                            precio: precioProducto,
                            cantidad: 1
                        });
                    }

                    localStorage.setItem("carrito", JSON.stringify(carrito));

                    // Redirige al carrito usando la ruta relativa correcta
                    window.location.href = "../carrito.html";
                });
            });
        });
    </script>
</body>
</html>
