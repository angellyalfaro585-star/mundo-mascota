<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras | Huellas & Estilo</title>
    <link rel="icon" type="image/png" href="huellitas.jpg">
    <link rel="stylesheet" href="style.css">
    <!-- Carrito -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras | Huellas & Estilo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carga diferida del script -->
    <script src="carrito.js" defer></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">🐾 Huellas<span>&</span>Estilo</div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="registro.html">Registrarse</a></li>
        </ul>
    </header>

    <section class="story-section">
        <div class="container">
            <div class="section-title">
                <h2>Tu Carrito de Compras</h2>
                <p>Resumen de productos seleccionados</p>
            </div>

            <div style="background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #ddd;">
                            <th style="padding: 10px;">Producto</th>
                            <th style="padding: 10px;">Cantidad</th>
                            <th style="padding: 10px;">Precio</th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                        <!-- Los productos guardados se cargan aquí con JavaScript -->
                     </tbody>
                </table>

                <h3 style="margin-top: 20px; text-align: right;">Total: $<span id="cart-total">0.00</span></h3>

                <div style="margin-top: 20px; text-align: right;">
                    <!-- El botón lleva al registro para simular la verificación obligatoria -->
                    <a href="registro.html" class="btn primary-btn">Realizar Compra</a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
